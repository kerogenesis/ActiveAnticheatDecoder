[package]
name = "decoder"
version = "1.3.1"
edition = "2024"
description = "Decoder for ActiveAnticheatCrypt"

[[bin]]
name = "decoder"
path = "src/main.rs"

[dependencies]
obfstr = "0.4.6"
blowfish = "0.10"
byteorder = "1.5"
cipher = { version = "0.5", features = ["block-padding"] }
flate2 = { version = "1.1", features = ["zlib"] }
num-bigint = "0.4"
num-traits = "0.2"
rayon = "1.10"
thiserror = "2.0"
walkdir = "2.5"
camino = "1.1"
sha1 = "0.10"
digest = "0.10"

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
debug = 0
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
