name: Build proxy DLL
description: >-
  Compiles proxy/aa_proxy.cpp into a 32-bit aa_proxy.dll with MSVC. The proxy
  relies on MSVC-specific linker pragmas and must match the 32-bit client, so
  the compiler flags live here once and are shared by every workflow.

outputs:
  dll-path:
    description: Absolute path to the compiled aa_proxy.dll.
    value: ${{ steps.expose.outputs.dll-path }}

runs:
  using: composite
  steps:
    - name: Compile aa_proxy.dll
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"
        if not defined VS_PATH (
          echo Could not locate a Visual Studio installation with x86 C++ tools.
          exit /b 1
        )
        call "%VS_PATH%\VC\Auxiliary\Build\vcvars32.bat"
        cl /nologo /LD /MT /O2 /EHsc /std:c++latest ^
          /DWIN32_LEAN_AND_MEAN /DNOMINMAX /D_CRT_SECURE_NO_WARNINGS ^
          /I proxy\vendor proxy\aa_proxy.cpp ^
          /Fe:aa_proxy.dll ^
          /link user32.lib /DEBUG:NONE /IGNORE:4104 /IGNORE:4197

    - name: Expose the DLL path
      id: expose
      shell: pwsh
      run: |
        "dll-path=$((Resolve-Path aa_proxy.dll).Path)" |
          Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
