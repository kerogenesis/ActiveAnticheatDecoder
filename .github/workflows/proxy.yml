name: proxy-dll

# The release workflow builds the proxy itself, so this workflow only acts as a
# fast smoke check that the DLL still compiles on pull requests.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-proxy:
    name: Compile proxy DLL
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build proxy DLL
        run: cargo build --release -p aa_proxy --target i686-pc-windows-msvc

      - name: Upload proxy DLL
        uses: actions/upload-artifact@v7
        with:
          name: aa_proxy-dll
          path: target/i686-pc-windows-msvc/release/aa_proxy.dll
