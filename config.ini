; Pick a name the client actually loads and that you are not already using for
; something else. The decoder tries them in order and uses the first one that
; is not already present in the client folder:
;   ddraw.dll
;   d3d9.dll
;   xinput1_4.dll
; If all three exist, ddraw.dll is temporarily replaced
; (the original is stashed aside and restored afterwards).
proxy_name = ddraw.dll
scryde_gamekitdata_auto_decode = true
